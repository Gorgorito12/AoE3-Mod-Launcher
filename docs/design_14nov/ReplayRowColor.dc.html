<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila de partida, con color</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:grid;grid-template-columns:6px minmax(0,1fr) auto;column-gap:9px;height:50px;box-sizing:border-box;padding:{{ pad }};align-items:start;box-shadow:{{ line }};background:{{ bg }};border-radius:{{ radius }};font-family:'Segoe UI',system-ui,sans-serif">
  <span aria-hidden="true" style="width:6px;height:6px;border-radius:3px;background:{{ dot }};box-shadow:{{ dotGlow }};margin-top:6px"></span>
  <div style="min-width:0;display:flex;flex-direction:column;gap:2px">
    <div style="display:flex;align-items:center;gap:6px;min-width:0;height:17px;font:400 13px/17px 'Segoe UI',system-ui,sans-serif;color:#8C9CB1">
      <sc-if value="{{ hasF }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:18px;height:12px;border-radius:2px;flex:none;background:{{ r.f1 }};box-shadow:0 0 0 1px rgba(255,255,255,.14)"></span></sc-if>
      <b style="font-weight:600;color:#f0f5fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto">{{ r.a }}</b>
      <span style="flex:none;white-space:nowrap;font-weight:{{ verbW }};color:{{ verbC }}">{{ r.verb }}</span>
      <sc-if value="{{ hasF }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:18px;height:12px;border-radius:2px;flex:none;background:{{ r.f2 }};box-shadow:0 0 0 1px rgba(255,255,255,.14)"></span></sc-if>
      <span style="color:{{ bC }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto">{{ r.b }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;min-width:0;height:15px;padding-left:{{ ind }}">
      <span style="flex:none;height:15px;box-sizing:border-box;padding:0 6px;border-radius:8px;display:flex;align-items:center;background:{{ chipBg }};box-shadow:inset 0 0 0 1px {{ chipRing }};font:700 9.5px/1 'Segoe UI',system-ui,sans-serif;letter-spacing:.04em;color:{{ modeC }};white-space:nowrap">{{ r.mode }}<span style="margin-left:4px">{{ r.fmt }}</span></span>
      <sc-if value="{{ hasMod }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="{{ r.modTitle }}" title="{{ r.modTitle }}" style="flex:none;width:14px;height:14px;border-radius:3px;background:{{ r.modIcon }};box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)"></span></sc-if>
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 11px/15px 'Segoe UI',system-ui,sans-serif;color:#8C9CB1"><span style="color:{{ nrC }}">{{ nr }}</span>{{ rest }}</span>
    </div>
  </div>
  <div style="height:38px;margin-bottom:-4px;min-width:44px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between">
    <span style="font:400 11px/14px 'Segoe UI',system-ui,sans-serif;color:#8C9CB1;white-space:nowrap">{{ r.age }}</span>
    <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:10px;background:rgba(47,127,224,.16);display:flex;align-items:center;justify-content:center"><svg width="10" height="11" viewBox="0 0 10 11" fill="none" stroke="#8cbcf5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 1v6.2M2.2 4.6 5 7.4l2.8-2.8M1.5 10h7"></path></svg></span></sc-if>
    <sc-if value="{{ isHover }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:10px;background:#2f7fe0;display:flex;align-items:center;justify-content:center"><svg width="10" height="11" viewBox="0 0 10 11" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 1v6.2M2.2 4.6 5 7.4l2.8-2.8M1.5 10h7"></path></svg></span></sc-if>
    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:10px;background:conic-gradient(#2f7fe0 0 40%,rgba(47,127,224,.22) 40% 100%);display:flex;align-items:center;justify-content:center"><span style="width:14px;height:14px;border-radius:7px;background:#12213a"></span></span></sc-if>
    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:10px;box-sizing:border-box;border:1px solid rgba(79,214,138,.55);display:flex;align-items:center;justify-content:center"><svg width="11" height="9" viewBox="0 0 11 9" fill="none" stroke="#4fd68a" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M1 1.5h3l1 1.2h5V8H1z"></path></svg></span></sc-if>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:10px;box-sizing:border-box;border:1px solid rgba(140,156,177,.6);display:flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#dce7f5" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8.6 5A3.6 3.6 0 1 1 7.5 2.4"></path><path d="M7.9 .8v2.1H5.8"></path></svg></span></sc-if>
    <sc-if value="{{ isExpired }}" hint-placeholder-val="{{ false }}"><span style="height:20px;display:flex;align-items:center;font:400 10.5px/1 'Segoe UI',system-ui,sans-serif;color:#8C9CB1;white-space:nowrap">{{ r.expiredLabel }}</span></sc-if>
  </div>
  <sc-if value="{{ hasTip }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:0;top:46px;z-index:5;width:250px;padding:9px 11px;border-radius:6px;background:#1a2c48;box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(130,175,255,.22);display:flex;flex-direction:column;gap:3px">
      <span style="font:600 12px/1.35 'Segoe UI',system-ui,sans-serif;color:#f0f5fb">{{ r.tip1 }}</span>
      <span style="font:400 11.5px/1.4 'Segoe UI',system-ui,sans-serif;color:#b9c9dc;text-wrap:pretty">{{ r.tip2 }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":120},"r":{"editor":null,"tsType":"object"}}'>
class Component extends DCLogic {
  renderVals() {
    const r = this.props.r || {};
    const st = r.st || 'none';
    const v = r.variant || 'line';
    const decided = r.result !== false, comp = !r.casual;
    const parts = [r.map, r.dur].filter(Boolean);
    const nr = decided ? '' : 'sin resultado';
    return {
      r,
      pad: v === 'tile' ? '8px 12px' : '8px 0',
      line: v === 'tile' ? 'inset 0 0 0 1px rgba(130,175,255,.10)' : v === 'strong' ? 'inset 0 -1px 0 rgba(130,175,255,.16)' : 'inset 0 -1px 0 rgba(130,175,255,.07)',
      bg: v === 'tile' ? '#172a45' : v === 'strong' && r.zebra ? 'rgba(130,175,255,.035)' : 'transparent',
      radius: v === 'tile' ? '6px' : '0',
      // Verde: partida decidida. Ámbar: competitiva que no contó. Gris: casual sin resultado.
      dot: decided ? '#4fd68a' : comp ? '#F4900C' : '#5d6f8a',
      dotGlow: decided ? '0 0 0 3px rgba(79,214,138,.18)' : comp ? '0 0 0 3px rgba(244,144,12,.18)' : 'none',
      verbC: decided ? '#7fe0a8' : '#8C9CB1', verbW: decided ? 600 : 400,
      bC: decided ? '#a8bcd2' : '#dce7f5',
      modeC: comp ? '#E6C06A' : '#A8BCD2',
      chipBg: comp ? 'rgba(230,192,106,.14)' : 'rgba(255,255,255,.06)',
      chipRing: comp ? 'rgba(230,192,106,.45)' : 'rgba(255,255,255,.12)',
      nr, nrC: comp ? '#F5BD76' : '#8C9CB1',
      rest: (nr && parts.length ? ' · ' : '') + parts.join(' · ') + (r.modName || ''),
      hasF: !!r.f1, ind: r.f1 ? '24px' : '0px',
      hasMod: !!r.modIcon,
      isIdle: st === 'idle', isHover: st === 'hover', isLoading: st === 'loading',
      isDone: st === 'done', isError: st === 'error', isExpired: st === 'expired',
      hasTip: !!r.tip1
    };
  }
}
</script>
</body>
</html>
